<script>
// ===== SCROLL REVEAL =====
function reveal() {
    document.querySelectorAll(".reveal").forEach(el => {
        if (el.getBoundingClientRect().top < window.innerHeight - 100) el.classList.add("active");
    });
}
window.addEventListener("scroll", reveal);

// ===== INICIO: se arma con el contenido que editas en admin-inicio.html =====
(async function () {
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const root = document.getElementById('inicio-root');
    const pie = document.getElementById('inicio-footer');
    const colorOk = c => /^#[0-9a-fA-F]{3,8}$/.test(String(c || '')) ? c : '#e6f2de';
    const linkOk = u => { u = String(u || '').trim(); return (!u || /^\s*javascript:/i.test(u)) ? 'products.html' : u; };
    const titulo = (t, r) => `<h2 class="font-headline-lg text-headline-lg text-primary"><span class="font-normal">${esc(t)}</span> <span class="font-extrabold">${esc(r)}</span></h2>`;

    // Contenido guardado + catálogo (con tiempo límite para que el inicio siempre cargue)
    const espera = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
    const [guardado, cat] = await Promise.all([
        espera(VJInicio.leerGuardado(), 5000),
        espera(VJCatalogo.cargar(), 9000)
    ]);
    const C = VJInicio.combinar(guardado);
    const productos = ((cat && cat.productos) || window.VJ_SEED || []).filter(p => p.tipo !== 'caja' && p.activo !== false);

    // Resolver todas las fotos (prod:, img:, archivo)
    const fotos = {};
    const refs = new Set();
    const juntar = o => { if (o && typeof o === 'object') Object.values(o).forEach(v => { if (v && typeof v === 'object') juntar(v); else if (typeof v === 'string' && /^(prod:|img:)/.test(v)) refs.add(v); }); };
    juntar(C);
    await Promise.all([...refs].map(async r => { fotos[r] = await VJInicio.foto(r, productos); }));
    const src = ref => esc(/^(prod:|img:)/.test(ref || '') ? (fotos[ref] || 'producto.webp') : (ref || 'producto.webp'));
    const img = (ref, cls) => `<img loading="lazy" decoding="async" src="${src(ref)}" alt="" class="vj-img ${cls}" onerror="this.onerror=null;this.src='producto.webp'">`;

    // 1) HERO
    const banners = (C.banners || []).filter(b => b && b.activo !== false);
    const hero = banners.length ? `
    <section class="vj-hero" id="hero">
      <div class="vj-hero-track" id="hero-track">
        ${banners.map(b => `
        <div class="vj-hero-slide" style="background:linear-gradient(120deg,${colorOk(b.fondo)},${colorOk(b.fondo2)})">
          <div class="max-w-container-max mx-auto px-gutter grid md:grid-cols-2 gap-6 items-center min-h-[460px] md:min-h-[540px] py-10">
            <div class="order-2 md:order-1">
              ${b.etiqueta ? `<span class="inline-block bg-primary text-white px-4 py-1 rounded-full font-label-sm text-label-sm mb-4">${esc(b.etiqueta)}</span>` : ''}
              <h1 class="font-display-lg text-display-lg text-primary mb-4 leading-tight">${esc(b.titulo)}</h1>
              <p class="font-body-lg text-body-lg text-on-surface-variant mb-8 max-w-lg">${esc(b.texto)}</p>
              ${b.boton ? `<a href="${esc(linkOk(b.enlace))}" class="inline-block border-2 border-primary text-primary px-8 py-3 rounded-full font-bold uppercase text-sm hover:bg-primary hover:text-white transition-all">${esc(b.boton)}</a>` : ''}
            </div>
            <div class="order-1 md:order-2 flex justify-center">${img(b.imagen, 'h-64 md:h-[420px] w-auto max-w-full drop-shadow-xl')}</div>
          </div>
        </div>`).join('')}
      </div>
      ${banners.length > 1 ? `
      <button id="hero-prev" class="vj-arrow absolute left-4 top-1/2 -translate-y-1/2 z-10" aria-label="Anterior"><span class="material-symbols-outlined">chevron_left</span></button>
      <button id="hero-next" class="vj-arrow absolute right-4 top-1/2 -translate-y-1/2 z-10" aria-label="Siguiente"><span class="material-symbols-outlined">chevron_right</span></button>
      <div class="absolute bottom-5 left-1/2 -translate-x-1/2 flex gap-3 z-10" id="hero-dots">${banners.map((_, i) => `<button class="vj-dot ${i ? '' : 'on'}" data-i="${i}" aria-label="Banner ${i + 1}"></button>`).join('')}</div>` : ''}
    </section>` : '';

    // 2) LÍNEAS (tarjetas altas con scroll)
    const L = C.lineas || {};
    const lineas = (L.items || []).length ? `
    <section class="py-16 md:py-20 px-gutter max-w-container-max mx-auto" id="lineas">
      <div class="flex items-end justify-between mb-8 reveal">${titulo(L.titulo, L.resaltado)}
        <div class="hidden md:flex gap-2"><button class="vj-arrow" data-scroll="-1" aria-label="Anterior"><span class="material-symbols-outlined">chevron_left</span></button><button class="vj-arrow" data-scroll="1" aria-label="Siguiente"><span class="material-symbols-outlined">chevron_right</span></button></div></div>
      <div class="vj-scroll reveal" id="lineas-scroll">
        ${L.items.map(it => `
        <a href="${esc(linkOk(it.enlace))}" class="w-[260px] md:w-[290px] h-[400px] md:h-[440px] rounded-lg p-6 flex flex-col justify-between overflow-hidden hover:-translate-y-1 hover:shadow-xl transition-all" style="background:${colorOk(it.color)}">
          <h3 class="font-extrabold text-xl text-primary">${esc(it.titulo)}</h3>
          ${img(it.imagen, 'h-[300px] md:h-[330px] w-full')}
        </a>`).join('')}
      </div>
      <a href="products.html" class="inline-flex items-center gap-1 mt-6 text-primary text-sm hover:underline">Ver todo el catálogo <span class="material-symbols-outlined text-base">chevron_right</span></a>
    </section>` : '';

    // 3) FAVORITOS (de tu catálogo, con precio real y carrito)
    const F = C.favoritos || {};
    const favs = (F.ids || []).map(id => productos.find(p => p.id === id)).filter(Boolean);
    const favoritos = favs.length ? `
    <section class="py-16 md:py-20 bg-surface-container-low" id="favoritos">
      <div class="max-w-container-max mx-auto px-gutter">
        <div class="flex items-end justify-between mb-8 reveal">${titulo(F.titulo, F.resaltado)}<a href="products.html" class="text-primary text-sm hover:underline">Ver todos</a></div>
        <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
          ${favs.map(p => `
          <div class="bg-white rounded-lg overflow-hidden flex flex-col reveal border border-outline-variant/30">
            <div class="p-6 pb-0">
              <h3 class="font-extrabold text-lg text-primary uppercase leading-tight">${esc(p.nombre)}</h3>
              <p class="text-sm text-on-surface-variant mt-1">${esc(p.categoria || '')}</p>
              <p class="text-primary font-extrabold text-xl mt-2">${VJCatalogo.fmt(VJCatalogo.precioFinal(p))}</p>
              <div class="flex items-center gap-2 mt-4">
                <a href="producto.html?p=${esc(p.id)}" class="border-2 border-primary text-primary px-5 py-2 rounded-full font-bold uppercase text-xs hover:bg-primary hover:text-white transition-all">Compra aquí</a>
                ${p.disponible === false ? '<span class="text-xs font-bold text-gray-500">Agotado</span>' : `<button type="button" data-add="${esc(p.id)}" class="w-10 h-10 rounded-full bg-primary text-white flex items-center justify-center hover:opacity-90" aria-label="Agregar al carrito"><span class="material-symbols-outlined text-xl">add_shopping_cart</span></button>`}
              </div>
            </div>
            <a href="producto.html?p=${esc(p.id)}" class="flex justify-center items-end h-64 p-6 mt-2">${img('prod:' + p.id, 'h-full w-auto max-w-full')}</a>
          </div>`).join('')}
        </div>
      </div>
    </section>` : '';

    // 4) ALIVIO PARA (mosaico)
    const A = C.alivio || {};
    const alivio = (A.items || []).length ? `
    <section class="py-16 md:py-20 px-gutter max-w-container-max mx-auto" id="alivio">
      <div class="mb-8 reveal">${titulo(A.titulo, A.resaltado)}</div>
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-4 reveal">
        ${A.items.map((it, i) => `
        <a href="${esc(linkOk(it.enlace))}" class="relative rounded-lg overflow-hidden flex items-end p-5 min-h-[190px] hover:shadow-xl transition-shadow ${i === 0 ? 'col-span-2 lg:col-span-1 lg:row-span-2 min-h-[260px]' : ''}" style="background:${colorOk(it.color)}">
          ${img(it.imagen, 'absolute inset-x-0 top-4 mx-auto h-[62%] w-auto max-w-[80%]')}
          <h3 class="relative font-extrabold text-primary text-lg leading-tight">${esc(it.titulo)}</h3>
        </a>`).join('')}
      </div>
      <a href="products.html" class="inline-flex items-center gap-1 mt-6 text-primary text-sm hover:underline">Descubre todos nuestros productos <span class="material-symbols-outlined text-base">chevron_right</span></a>
    </section>` : '';

    // 5) QUÉ CONTIENEN
    const Q = C.contienen || {};
    const contienen = (Q.items || []).length ? `
    <section class="py-16 md:py-20 bg-surface-container-low" id="contienen">
      <div class="max-w-container-max mx-auto px-gutter">
        <div class="mb-8 reveal">${titulo(Q.titulo, Q.resaltado)}</div>
        <div class="grid md:grid-cols-3 gap-6">
          ${Q.items.map(it => `
          <div class="rounded-lg overflow-hidden flex flex-col reveal" style="background:${colorOk(it.color)}">
            <div class="p-6">
              <h3 class="font-extrabold text-xl text-primary mb-2">${esc(it.titulo)}</h3>
              <p class="text-sm text-on-surface-variant leading-relaxed mb-4">${esc(it.texto)}</p>
              ${it.boton ? `<a href="${esc(linkOk(it.enlace))}" class="inline-block border-2 border-primary text-primary px-5 py-2 rounded-full font-bold uppercase text-xs hover:bg-primary hover:text-white transition-all">${esc(it.boton)}</a>` : ''}
            </div>
            <div class="flex justify-center items-end h-72 p-4 mt-auto">${img(it.imagen, 'h-full w-auto max-w-full')}</div>
          </div>`).join('')}
        </div>
      </div>
    </section>` : '';

    // 6) INGREDIENTES
    const I = C.ingredientes || {};
    const ingredientes = (I.items || []).length ? `
    <section class="py-16 md:py-24 px-gutter max-w-container-max mx-auto" id="ingredientes">
      <div class="text-center mb-12 reveal"><h2 class="font-headline-lg text-headline-lg text-primary mb-3">${esc(I.titulo)}</h2>
        <p class="font-body-lg text-body-lg text-on-surface-variant max-w-2xl mx-auto">${esc(I.texto)}</p></div>
      <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
        ${I.items.map(it => `
        <div class="bg-surface-cream p-8 rounded-lg border border-outline-variant/30 hover:border-primary/50 transition-colors reveal">
          <div class="w-14 h-14 bg-primary-fixed rounded-full flex items-center justify-center mb-5 text-primary"><span class="material-symbols-outlined text-3xl">${esc(it.icono || 'eco')}</span></div>
          <h3 class="font-headline-md text-headline-md text-on-surface mb-2">${esc(it.titulo)}</h3>
          <p class="font-body-md text-body-md text-on-surface-variant">${esc(it.texto)}</p>
        </div>`).join('')}
      </div>
    </section>` : '';

    // 7) HISTORIA
    const H = C.historia || {};
    const historia = `
    <section class="py-16 md:py-24 bg-surface-cream overflow-hidden" id="about">
      <div class="max-w-container-max mx-auto px-gutter grid lg:grid-cols-2 gap-12 items-center">
        <div class="reveal flex justify-center"><div class="vj-blob bg-white shadow-xl p-8 w-[300px] h-[340px] md:w-[400px] md:h-[440px] flex items-center justify-center" style="background:#dcedd2">${img(H.imagen, 'h-full w-auto max-w-full')}</div></div>
        <div class="reveal">
          <h2 class="font-display-lg text-display-lg text-primary uppercase mb-6 leading-tight">${esc(H.titulo)}</h2>
          <p class="font-body-lg text-body-lg text-on-surface-variant mb-4">${esc(H.texto1)}</p>
          <p class="font-body-lg text-body-lg text-on-surface-variant mb-6">${esc(H.texto2)}</p>
          <ul class="space-y-3 mb-8">${(H.puntos || []).map(t => `<li class="flex items-center gap-3"><span class="material-symbols-outlined text-leaf-vibrant">check_circle</span><span>${esc(t)}</span></li>`).join('')}</ul>
          ${H.boton ? `<a href="${esc(linkOk(H.enlace))}" class="inline-block border-2 border-primary text-primary px-8 py-3 rounded-full font-bold uppercase text-sm hover:bg-primary hover:text-white transition-all">${esc(H.boton)}</a>` : ''}
        </div>
      </div>
    </section>`;

    // 8) LLAMADO FINAL
    const K = C.cta || {};
    const cta = `
    <section class="py-16 px-gutter"><div class="max-w-container-max mx-auto bg-primary rounded-[2rem] p-10 md:p-16 text-center reveal">
      <h2 class="font-display-lg text-display-lg text-on-primary mb-4">${esc(K.titulo)}</h2>
      <p class="font-body-lg text-body-lg text-on-primary/80 mb-8 max-w-2xl mx-auto">${esc(K.texto)}</p>
      <a href="${esc(linkOk(K.enlace))}" class="inline-block bg-surface-cream text-primary px-10 py-4 rounded-full font-bold hover:scale-105 transition-all shadow-xl">${esc(K.boton)}</a>
    </div></section>`;

    root.innerHTML = hero + lineas + favoritos + alivio + contienen + ingredientes + historia + cta;

    // PIE DE PÁGINA
    const P = C.pie || {};
    pie.innerHTML = `
    <div class="max-w-container-max mx-auto px-gutter py-12 grid md:grid-cols-3 gap-10">
      <div><div class="font-extrabold text-xl mb-3">El Viejito John</div><p class="text-white/80 text-sm max-w-xs">${esc(P.descripcion)}</p></div>
      <div><h4 class="font-bold mb-4 uppercase text-sm">Productos</h4><ul class="space-y-2 text-sm text-white/80">
        ${productos.slice(0, 7).map(p => `<li><a class="hover:text-white" href="producto.html?p=${esc(p.id)}">${esc(p.nombre)}</a></li>`).join('')}
        <li><a class="hover:text-white font-bold" href="products.html">Ver catálogo completo</a></li></ul></div>
      <div><h4 class="font-bold mb-4 uppercase text-sm">Información</h4><ul class="space-y-2 text-sm text-white/80">
        <li><a class="hover:text-white" href="#lineas">Líneas</a></li><li><a class="hover:text-white" href="#ingredientes">Ingredientes</a></li>
        <li><a class="hover:text-white" href="#about">Nosotros</a></li><li><a class="hover:text-white" href="rastreo.html">Rastrea tu pedido</a></li></ul></div>
    </div>
    <div class="border-t border-white/20"><div class="max-w-container-max mx-auto px-gutter py-6 text-xs text-white/70 leading-relaxed">
      <p class="mb-2">${esc(P.aviso)}</p><p>© ${new Date().getFullYear()} El Gel Balsámico del Viejito John. Todos los derechos reservados.</p></div></div>`;

    // Carrusel principal
    (function () {
        const track = document.getElementById('hero-track');
        if (!track) return;
        const dots = [...document.querySelectorAll('.vj-dot')];
        const total = banners.length;
        let cur = 0, auto;
        const ir = i => { cur = (i + total) % total; track.style.transform = `translateX(-${cur * 100}%)`; dots.forEach((d, k) => d.classList.toggle('on', k === cur)); };
        const reinicia = () => { clearInterval(auto); auto = setInterval(() => ir(cur + 1), 6500); };
        const p = document.getElementById('hero-prev'), n = document.getElementById('hero-next');
        if (p) p.onclick = () => { ir(cur - 1); reinicia(); };
        if (n) n.onclick = () => { ir(cur + 1); reinicia(); };
        dots.forEach(d => d.onclick = () => { ir(Number(d.dataset.i)); reinicia(); });
        if (total > 1) reinicia();
    })();
    // Flechas de la fila de líneas
    document.querySelectorAll('[data-scroll]').forEach(b => b.onclick = () => {
        const s = document.getElementById('lineas-scroll');
        if (s) s.scrollBy({ left: Number(b.dataset.scroll) * 310, behavior: 'smooth' });
    });
    reveal();
})();

// ===== COUNTDOWN TIMER =====
(async function() {
    const banner = document.getElementById('countdown-banner');
    const msgEl = document.getElementById('countdown-message');
    const dEl = document.getElementById('cd-days');
    const hEl = document.getElementById('cd-hours');
    const mEl = document.getElementById('cd-minutes');
    const sEl = document.getElementById('cd-seconds');

    let timerData = {};
    try {
        if (window.loadCollection) {
            const cfg = await loadCollection('config');
            timerData = (cfg || []).find(d => d.id === 'ofertaTimer') || {};
        }
    } catch (e) { console.warn('No se pudo cargar el cronómetro de oferta.', e); }
    if (!timerData.active || !timerData.endDate) return;

    const endDate = new Date(timerData.endDate);
    msgEl.textContent = timerData.message || '¡Oferta especial por tiempo limitado!';
    banner.classList.remove('hidden');

    function updateCountdown() {
        const diff = endDate - new Date();
        if (diff <= 0) { banner.classList.add('hidden'); return; }
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff % 86400000) / 3600000);
        const minutes = Math.floor((diff % 3600000) / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        dEl.textContent = String(days).padStart(2, '0');
        hEl.textContent = String(hours).padStart(2, '0');
        mEl.textContent = String(minutes).padStart(2, '0');
        sEl.textContent = String(seconds).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
})();

// Mobile Menu Toggle
(function() {
    const menuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const menuIcon = document.getElementById('menu-icon');
    if (menuBtn && mobileMenu) {
        menuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.contains('hidden');
            mobileMenu.classList.toggle('hidden', !isHidden);
            menuIcon.textContent = isHidden ? 'close' : 'menu';
        });
    }
})();
</script>
