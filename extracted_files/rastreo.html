<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Rastrear pedido | VJ.Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="vendor/firebase-app-compat.js"></script>
    <script src="vendor/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root { --verde: #154212; --verde-claro: #e8f3e6; --gris: #6b7280; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #fbf8f3; color: #1f2937; min-height: 100vh; }
        header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
        header a { color: var(--verde); font-weight: 700; text-decoration: none; font-size: 14px; }
        main { max-width: 560px; margin: 0 auto; padding: 28px 18px 60px; }
        h1 { font-size: 26px; font-weight: 800; color: var(--verde); margin: 0 0 6px; }
        p.sub { color: var(--gris); font-size: 14px; margin: 0 0 20px; }
        .caja { background: #fff; border: 1px solid #e5e7eb; border-radius: 18px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
        form { display: flex; gap: 10px; }
        input { flex: 1; min-width: 0; border: 1px solid #d1d5db; border-radius: 12px; padding: 13px 14px; font-size: 16px; text-transform: uppercase; letter-spacing: .5px; }
        button.principal { background: var(--verde); color: #fff; border: 0; border-radius: 12px; padding: 0 20px; font-weight: 800; font-size: 15px; cursor: pointer; }
        button.principal:disabled { opacity: .6; }
        #resultado { margin-top: 20px; }
        .estado { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .estado .icono { width: 46px; height: 46px; border-radius: 50%; background: var(--verde-claro); color: var(--verde); display: flex; align-items: center; justify-content: center; flex: none; }
        .estado .icono.cancel { background: #fee2e2; color: #b91c1c; }
        .estado h2 { margin: 0; font-size: 20px; color: var(--verde); }
        .codigo { font-size: 13px; color: var(--gris); margin: 0 0 18px; }
        .productos { background: #f9fafb; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 18px; }
        ol { list-style: none; margin: 0; padding: 0; }
        li.paso { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
        li.paso:last-child { padding-bottom: 0; }
        li.paso::before { content: ''; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: #e5e7eb; }
        li.paso:last-child::before { display: none; }
        li.paso.hecho::before { background: var(--verde); }
        .punto { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #d1d5db; background: #fff; flex: none; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; }
        li.paso.hecho .punto { background: var(--verde); border-color: var(--verde); }
        li.paso.actual .punto { box-shadow: 0 0 0 4px var(--verde-claro); }
        .paso .t { font-weight: 700; font-size: 15px; line-height: 1.2; }
        .paso.pendiente .t { color: #9ca3af; font-weight: 600; }
        .paso .f { font-size: 12px; color: var(--gris); margin-top: 2px; }
        .guia { margin-top: 18px; background: var(--verde-claro); border-radius: 12px; padding: 14px; font-size: 14px; }
        .guia b { font-size: 17px; letter-spacing: .5px; word-break: break-all; }
        .guia button { margin-top: 8px; background: #fff; border: 1px solid var(--verde); color: var(--verde); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .error { background: #fef2f2; color: #b91c1c; border-radius: 12px; padding: 14px; font-size: 14px; }
        .ayuda { margin-top: 22px; text-align: center; font-size: 13px; color: var(--gris); }
        .ayuda a { color: var(--verde); font-weight: 700; }
    </style>
</head>
<body>
<header>
    <a href="index.html">← VJ.Lab</a>
    <a href="products.html">Catálogo</a>
</header>
<main>
    <h1>Rastrear mi pedido</h1>
    <p class="sub">Escribe tu número de pedido (empieza con VJ-). Lo encuentras en el mensaje de WhatsApp de tu pedido.</p>
    <div class="caja">
        <form id="form">
            <input id="codigo" type="text" placeholder="VJ-XXXXXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Número de pedido">
            <button class="principal" id="buscar" type="submit">Buscar</button>
        </form>
        <div id="resultado" aria-live="polite"></div>
    </div>
    <p class="ayuda">¿Dudas con tu pedido? <a href="https://wa.me/528113160143?text=Hola,%20tengo%20una%20duda%20sobre%20mi%20pedido." target="_blank" rel="noopener">Escríbenos por WhatsApp</a></p>
</main>

<script>
    const PASOS = [
        ['nuevo', 'Pedido recibido', 'inventory_2'],
        ['link_enviado', 'Link de pago enviado', 'link'],
        ['pagado', 'Pago confirmado', 'payments'],
        ['enviado', 'Enviado', 'local_shipping'],
        ['entregado', 'Entregado', 'check_circle']
    ];
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fechaTxt = f => { try { return new Date(f).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return ''; } };
    const $ = id => document.getElementById(id);

    function normalizar(v) {
        let c = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (c.startsWith('VJ')) c = c.slice(2);
        return c ? 'VJ-' + c : '';
    }

    function pintar(d, codigo) {
        const estado = d.estado || 'nuevo';
        const hist = Array.isArray(d.historial) && d.historial.length ? d.historial : [{ estado: 'nuevo', fecha: d.fecha }];
        const fechaDe = e => { const h = hist.slice().reverse().find(x => x.estado === e); return h ? fechaTxt(h.fecha) : ''; };
        const productos = d.productos ? `<div class="productos">${esc(d.productos)}</div>` : '';

        if (estado === 'cancelado') {
            $('resultado').innerHTML = `
                <div class="estado"><div class="icono cancel"><span class="material-symbols-outlined">cancel</span></div><h2>Pedido cancelado</h2></div>
                <p class="codigo">Pedido ${esc(codigo)}</p>${productos}
                <p style="font-size:14px">Si tienes dudas, escríbenos por WhatsApp.</p>`;
            return;
        }

        const idx = Math.max(0, PASOS.findIndex(p => p[0] === estado));
        const actual = PASOS[idx];
        const pasos = PASOS.map((p, i) => {
            const clase = i < idx ? 'hecho' : (i === idx ? 'hecho actual' : 'pendiente');
            const f = i <= idx ? fechaDe(p[0]) : '';
            return `<li class="paso ${clase}"><div class="punto">${i <= idx ? '✓' : ''}</div><div><div class="t">${p[1]}</div>${f ? `<div class="f">${esc(f)}</div>` : ''}</div></li>`;
        }).join('');

        const guia = d.guia ? `<div class="guia">${d.paqueteria ? `Paquetería: <b>${esc(d.paqueteria)}</b><br>` : ''}Número de guía:<br><b id="guiaTxt">${esc(d.guia)}</b><br><button type="button" id="copiar">Copiar guía</button></div>` : '';

        $('resultado').innerHTML = `
            <div class="estado"><div class="icono"><span class="material-symbols-outlined">${actual[2]}</span></div><h2>${actual[1]}</h2></div>
            <p class="codigo">Pedido ${esc(codigo)}${d.actualizado ? ' · actualizado ' + esc(fechaTxt(d.actualizado)) : ''}</p>
            ${productos}<ol>${pasos}</ol>${guia}`;
        const b = $('copiar');
        if (b) b.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(d.guia); b.textContent = '¡Copiada!'; } catch (e) { prompt('Copia tu guía:', d.guia); }
        });
    }

    async function buscar(valor) {
        const codigo = normalizar(valor);
        const out = $('resultado');
        if (!/^VJ-[A-Z0-9]{8}$/.test(codigo)) { out.innerHTML = '<div class="error">El número de pedido debe verse como VJ-ABCD2345. Revísalo e inténtalo de nuevo.</div>'; return; }
        $('codigo').value = codigo;
        $('buscar').disabled = true;
        out.innerHTML = '<p style="color:#6b7280;font-size:14px">Buscando…</p>';
        try {
            if (typeof db === 'undefined' || !db) throw new Error('sin conexión');
            const snap = await db.collection('seguimiento').doc(codigo).get();
            if (!snap.exists) out.innerHTML = '<div class="error">No encontramos ese número de pedido. Revisa que esté completo o escríbenos por WhatsApp.</div>';
            else pintar(snap.data(), codigo);
        } catch (e) {
            console.warn(e);
            out.innerHTML = '<div class="error">No pudimos consultar tu pedido en este momento. Inténtalo de nuevo en unos minutos.</div>';
        }
        $('buscar').disabled = false;
    }

    $('form').addEventListener('submit', e => { e.preventDefault(); buscar($('codigo').value); });
    const inicial = new URLSearchParams(location.search).get('c');
    if (inicial) buscar(inicial);
</script>
</body>
</html>
